name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit, integration and end-to-end tests
        run: npm test -- --runInBand --forceExit

      - name: GUI end-to-end tests (browser + Electron)
        run: |
          npx playwright install --with-deps chromium
          xvfb-run -a npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
      max-parallel: 2
    
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Sync package version with tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Tag: ${TAG}"
          echo "Version: ${VERSION}"
          npm version --no-git-tag-version --allow-same-version "${VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        run: npm run dist:win -- --publish never

      - name: Build Linux Installers
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux -- --publish never

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: release/*.msi
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: linux-installers
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success() && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: List downloaded artifacts
        run: ls -R

      - name: Create or Update Release (retry)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          TAG="${GITHUB_REF#refs/tags/}"
          FILES=(
            windows-installer/*.msi
            linux-installers/*.AppImage
            linux-installers/*.deb
          )

          echo "Resolved artifacts:"
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No release artifacts found after download."
            ls -R
            exit 1
          fi
          printf ' - %s\n' "${FILES[@]}"

          MSI_COUNT=0
          APPIMAGE_COUNT=0
          DEB_COUNT=0
          for f in "${FILES[@]}"; do
            if [[ "$f" == *.msi ]]; then MSI_COUNT=$((MSI_COUNT + 1)); fi
            if [[ "$f" == *.AppImage ]]; then APPIMAGE_COUNT=$((APPIMAGE_COUNT + 1)); fi
            if [[ "$f" == *.deb ]]; then DEB_COUNT=$((DEB_COUNT + 1)); fi
          done

          if [[ "$MSI_COUNT" -eq 0 || "$APPIMAGE_COUNT" -eq 0 || "$DEB_COUNT" -eq 0 ]]; then
            echo "Expected at least one .msi, .AppImage, and .deb artifact."
            echo "Found: msi=$MSI_COUNT appimage=$APPIMAGE_COUNT deb=$DEB_COUNT"
            ls -R
            exit 1
          fi

          run_with_retry() {
            local max_attempts="$1"
            shift
            local attempt=1
            local delay=5

            until "$@"; do
              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          gh --version

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            run_with_retry 5 gh release upload "$TAG" "${FILES[@]}" --repo "$GH_REPO" --clobber
          else
            run_with_retry 5 gh release create "$TAG" "${FILES[@]}" --repo "$GH_REPO" --title "$TAG" --generate-notes
          fi