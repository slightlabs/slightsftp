name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write      # keyless signing (Sigstore) and build provenance
  attestations: write  # GitHub artifact attestations

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit, integration and end-to-end tests
        run: npm test -- --runInBand --forceExit

      - name: GUI end-to-end tests (browser + Electron)
        run: |
          npx playwright install --with-deps chromium
          xvfb-run -a npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
      max-parallel: 3
    
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Sync package version with tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Tag: ${TAG}"
          echo "Version: ${VERSION}"
          npm version --no-git-tag-version --allow-same-version "${VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Code signing happens only when the certificates are configured as repository
      # secrets; otherwise the installers are built unsigned, as before.
      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win -- --publish never

      - name: Build Linux Installers
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux -- --publish never

      - name: Build macOS Installer (signed and notarized when certificates are configured)
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::MAC_CSC_LINK is not set: building an unsigned .dmg"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npm run dist:mac -- --publish never -c.mac.identity=null
          else
            npm run dist:mac -- --publish never
          fi

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v5
        with:
          name: mac-installer
          path: release/*.dmg
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: release/*.msi
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: linux-installers
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM and SLSA provenance attached to the image as attestations
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do images="$images ${tag}@${DIGEST}"; done
          cosign sign --yes $images

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success() && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code (for the SBOM)
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Software bill of materials (CycloneDX)
        run: |
          npm ci --ignore-scripts --omit=dev
          npm sbom --omit=dev --sbom-format cyclonedx --sbom-type application > sbom.cdx.json

      - name: Download installers
        uses: actions/download-artifact@v5
        with:
          pattern: '*-installer*'
          # windows-installer, linux-installers, mac-installer

      - name: List downloaded artifacts
        run: ls -R

      - name: Attest build provenance of the installers
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            windows-installer/*.msi
            linux-installers/*.AppImage
            linux-installers/*.deb
            mac-installer/*.dmg

      - name: Create or Update Release (retry)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          TAG="${GITHUB_REF#refs/tags/}"
          FILES=(
            windows-installer/*.msi
            linux-installers/*.AppImage
            linux-installers/*.deb
            mac-installer/*.dmg
          )

          # checksums for every installer, and the SBOM
          sha256sum "${FILES[@]}" | sed 's#  [^ ]*/#  #' > SHA256SUMS
          cat SHA256SUMS
          FILES+=(SHA256SUMS sbom.cdx.json)

          echo "Resolved artifacts:"
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No release artifacts found after download."
            ls -R
            exit 1
          fi
          printf ' - %s\n' "${FILES[@]}"

          MSI_COUNT=0
          APPIMAGE_COUNT=0
          DEB_COUNT=0
          for f in "${FILES[@]}"; do
            if [[ "$f" == *.msi ]]; then MSI_COUNT=$((MSI_COUNT + 1)); fi
            if [[ "$f" == *.AppImage ]]; then APPIMAGE_COUNT=$((APPIMAGE_COUNT + 1)); fi
            if [[ "$f" == *.deb ]]; then DEB_COUNT=$((DEB_COUNT + 1)); fi
          done

          if [[ "$MSI_COUNT" -eq 0 || "$APPIMAGE_COUNT" -eq 0 || "$DEB_COUNT" -eq 0 ]]; then
            echo "Expected at least one .msi, .AppImage, and .deb artifact."
            echo "Found: msi=$MSI_COUNT appimage=$APPIMAGE_COUNT deb=$DEB_COUNT"
            ls -R
            exit 1
          fi

          run_with_retry() {
            local max_attempts="$1"
            shift
            local attempt=1
            local delay=5

            until "$@"; do
              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          gh --version

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            run_with_retry 5 gh release upload "$TAG" "${FILES[@]}" --repo "$GH_REPO" --clobber
          else
            run_with_retry 5 gh release create "$TAG" "${FILES[@]}" --repo "$GH_REPO" --title "$TAG" --generate-notes
          fi