name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
      max-parallel: 2
    
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        run: npm run dist:win -- --publish never

      - name: Build Linux Installers
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux -- --publish never

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: release/*.msi
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: linux-installers
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success() && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: List downloaded artifacts
        run: ls -R

      - name: Create or Update Release (retry)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          FILES=(
            windows-installer/*.msi
            linux-installers/*.AppImage
            linux-installers/*.deb
          )

          for f in "${FILES[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "Missing expected artifact: $f"
              exit 1
            fi
          done

          run_with_retry() {
            local max_attempts="$1"
            shift
            local attempt=1
            local delay=5

            until "$@"; do
              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            run_with_retry 5 gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            run_with_retry 5 gh release create "$TAG" "${FILES[@]}" --title "$TAG" --generate-notes
          fi